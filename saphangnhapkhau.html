<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Sạp Hàng Nhập Khẩu</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #fff8e1;
        margin: 0;
        padding: 0;
      }
      header {
        background-color: #6d4c41;
        color: white;
        text-align: center;
        padding: 20px;
      }
      main {
        max-width: 1000px;
        margin: auto;
        padding: 20px;
        background-color: white;
      }
      .product-list {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      .product-card:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
      .product-card {
        flex: 1 1 calc(33.333% - 20px);
        background-color: #fbe9e7;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .product-card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 8px;
      }
      .product-card h3 {
        margin: 10px 0 5px;
        color: #4e342e;
      }
      .buy-button {
        background-color: #e6fff1;
        color: #2b0066;
        border: none;
        padding: 10px 30px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .buy-button:hover {
        transform: scale(1.05);
        box-shadow: 0 2px 8px rgba(0, 50, 100, 0.2);
      }
      footer {
        text-align: center;
        background-color: #6d4c41;
        color: white;
        padding: 15px;
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Sạp Hàng Nhập Khẩu</h1>
    </header>

    <main>
      <h2>Chuyên cung cấp hàng nhập khẩu từ nước ngoài chất lượng</h2>
      <div class="product-list">
        <div class="product-card">
          <img src="images/tao-my.jpg" alt="Táo Mỹ đỏ" />
          <h3>Táo Mỹ đỏ</h3>
          <a href="taomy.html"
            ><button class="buy-button">Xem Chi Tiết</button></a
          >
        </div>

        <div class="product-card">
          <img src="images/nho-uc.jpg" alt="Nho đen không hạt Úc" />
          <h3>Nho đen không hạt Úc</h3>
          <a href="nhouc.html"
            ><button class="buy-button">Xem Chi Tiết</button></a
          >
        </div>

        <div class="product-card">
          <img src="images/cam-aicap.jpg" alt="Cam Ai Cập" />
          <h3>Cam Ai Cập</h3>
          <a href="camaicap.html"
            ><button class="buy-button">Xem Chi Tiết</button></a
          >
        </div>

        <div class="product-card">
          <img src="images/kiwi.jpg" alt="Kiwi vàng New Zealand" />
          <h3>Kiwi vàng New Zealand</h3>
          <a href="kiwi.html"
            ><button class="buy-button">Xem Chi Tiết</button></a
          >
        </div>

        <div class="product-card">
          <img src="images/bo-kobe.jpg" alt="Thịt bò Kobe Nhật Bản" />
          <h3>Thịt bò Kobe Nhật Bản</h3>
          <a href="bokobe.html"
            ><button class="buy-button">Xem Chi Tiết</button></a
          >
        </div>

        <div class="product-card">
          <img src="images/ca-hoi.jpg" alt="Cá hồi Na Uy phi lê" />
          <h3>Cá hồi Na Uy phi lê</h3>
          <a href="cahoi.html"
            ><button class="buy-button">Xem Chi Tiết</button></a
          >
        </div>
      </div>
    </main>

    <a href="index.html">← Quay lại</a>
    <footer>&copy; 2025 Sạp Hàng Nhập Khẩu</footer>
  </body>
</html>
